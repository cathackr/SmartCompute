[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartcompute"
dynamic = ["version"]
description = "Toolkit open source para monitoreo de host y análisis de protocolos industriales OT/ICS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Martín Iribarne", email = "seguridadwtf@proton.me" },
]
keywords = ["monitoring", "industrial", "ot", "ics", "scada", "osi", "protocols"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.8.0",
    "netifaces>=0.11.0",
    "cryptography>=42.0.0",
    "numpy>=1.21.0",
    "fastapi>=0.115.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
# Dashboard gráfico (core/dashboard.py)
viz = ["matplotlib>=3.5.0"]
# Captura/IO de buses industriales (base para la captura pasiva del roadmap)
industrial = [
    "scapy>=2.4.5",
    "python-can>=4.3.0",
]
# Servidor de la API: 'smartcompute serve' necesita uvicorn
serve = ["uvicorn[standard]>=0.31.0"]
# Integraciones SIEM (Splunk/Wazuh): PyYAML para leer siem_config.yaml
siem = ["PyYAML>=6.0"]
# Instalación completa: todos los extras funcionales en un solo paso
full = [
    "matplotlib>=3.5.0",
    "uvicorn[standard]>=0.31.0",
    "scapy>=2.4.5",
    "python-can>=4.3.0",
    "PyYAML>=6.0",
]
dev = [
    "uvicorn[standard]>=0.31.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/cathackr/SmartCompute"
Documentation = "https://github.com/cathackr/SmartCompute#readme"
Repository = "https://github.com/cathackr/SmartCompute"
Issues = "https://github.com/cathackr/SmartCompute/issues"

[project.scripts]
smartcompute = "smartcompute.cli:main"

[tool.hatch.version]
path = "src/smartcompute/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcompute"]

[tool.hatch.build.targets.sdist]
include = [
    "src/smartcompute/",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_strict_optional = true

[tool.coverage.run]
source = ["smartcompute"]

[tool.coverage.report]
show_missing = true
fail_under = 0
